<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Furriecat</title>

<style>
/* === สไตล์เดิมของคุณ (คงเดิมทุกประการ) === */
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#fff5f8;
text-align:center;
}

h1{
color:#ff6fa5;
margin-top:40px;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:30px;
max-width:900px;
margin:auto;
}

.card{
background:white;
padding:40px 20px;
border-radius:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-decoration:none;
color:#333;
font-weight:bold;
transition:.3s;
cursor:pointer;
-webkit-tap-highlight-color: transparent;
}

.card:hover, .card:active {
transform: scale(1.05) !important; 
background: #ffe4ef !important;
}

.section{display:none;padding:30px;}
.section.active{display:block;}

img{
width:90%;
max-width:600px;
margin:20px auto;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

/* CALCULATOR - คงเดิมทุกอย่าง */
.container{
background:#ffffff;
width:85%;
max-width:450px;
margin:40px auto;
padding:30px 20px;
border-radius:24px;
box-shadow:0 15px 35px rgba(255,150,200,0.3);
box-sizing:border-box;
}

label{
display:block;
color:#ff9ccc;
font-weight:bold;
margin-top:15px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
background:#fffefa;
border:1px solid #ffe6f2;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

input:focus{
outline:none;
background:#fff9fc;
border:2px solid #ffeaf4;
}

.calcbtn{
width:100%;
margin:20px 0;
padding:15px;
background:#f2ffd9;
color:#a9e400;
border:none;
border-radius:12px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:10px;
text-align:center;
border-bottom:1px solid #ffb6da;
}

th{color:#b388ff;}

.total-row td{
font-weight:bold;
color:#65d0ff;
border-bottom:none;
}

/* === ส่วนที่เพิ่มใหม่: ปุ่มดอกไม้น่ารัก (ไม่มีเส้นประ) === */
.nav-floating {
    position: fixed;
    top: 20px;
    left: 0;
    right: 0;
    width: 100%;
    pointer-events: none;
    z-index: 9999;
}

.flower-btn {
    pointer-events: auto;
    width: 45px;
    height: 45px;
    background: #ffb6da;
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 50%;
    border: none;
    box-shadow: 0 4px 8px rgba(255, 150, 200, 0.3);
    transition: 0.2s;
}

/* สร้างทรงกลีบดอกไม้โค้งมน */
.flower-btn::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: inherit;
    border-radius: inherit;
    transform: rotate(45deg);
    z-index: -1;
}

#btn-back { left: 15px; }
#btn-next { right: 15px; }

/* ลูกศรฟอนต์ไอติมมนๆ */
.arrow-text {
    color: white;
    font-size: 30px;
    font-weight: bold;
    font-family: "Comic Sans MS", "Chalkboard SE", cursive;
    line-height: 0;
    margin-bottom: 4px;
    user-select: none;
}

.flower-btn:active { transform: scale(0.8); }

</style>
</head>

<body ontouchstart="">

<div id="floating-nav" class="nav-floating" style="display: none;">
    <div id="btn-back" class="flower-btn" onclick="goHome()">
        <span class="arrow-text">‹</span>
    </div>
    <div id="btn-next" class="flower-btn" onclick="goNext()">
        <span class="arrow-text">›</span>
    </div>
</div>

<div id="home" class="section active">
    <h1>All about Furriecat</h1>
    <div class="menu">
        <div class="card" onclick="openPage('mock')">MOCK GED</div>
        <div class="card">VIDEO COURSES GED</div>
        <div class="card">VIDEO COURSE SAT</div>
        <div class="card" onclick="openPage('calculator')">GED SCORE CALCULATOR</div>
        <div class="card">SAT CALCULATOR</div>
        <div class="card" onclick="openPage('products')">PRODUCTS</div>
    </div>
</div>

<div id="mock" class="section">
    <h2>GED Mock Tests</h2>
    <img src="images/mock1.jpg">
</div>

<div id="products" class="section">
    <h2>Furriecat Promotion Sets</h2>
    <img src="images/promo1.jpg">
</div>

<div id="calculator" class="section">
    <div class="container">
        <h2 style="color:#eea9fc;">｡𖦹°⋆ GED score to GPA & GPAX calculator ₊˚𝜗𝜚˚⋆</h2>
        <label>Mathematical Reasoning:</label>
        <input type="number" id="math" placeholder="0-200">
        <label>Reasoning Through Language Arts (RLA):</label>
        <input type="number" id="rla" placeholder="0-200">
        <label>Social Studies:</label>
        <input type="number" id="soc" placeholder="0-200">
        <label>Science:</label>
        <input type="number" id="sci" placeholder="0-200">
        <button class="calcbtn" onclick="calculateGPA()">｡⋆𐙚⋆ calculate ₊⊹♡ᵎᵎ</button>
        <div id="res"></div>
    </div>
</div>

<script>
// ลำดับหน้าสำหรับปุ่มถัดไป
const pageList = ['home', 'mock', 'calculator', 'products'];

function openPage(page){
    document.querySelectorAll('.section').forEach(sec=>sec.classList.remove('active'));
    document.getElementById(page).classList.add('active');
    
    // แสดงปุ่มเฉพาะหน้าอื่นที่ไม่ใช่หน้า Home
    const nav = document.getElementById('floating-nav');
    if(page === 'home') {
        nav.style.display = 'none';
    } else {
        nav.style.display = 'block';
    }
    
    window.scrollTo(0,0);
}

function goHome(){
    openPage('home');
}

function goNext(){
    const current = document.querySelector('.section.active').id;
    let idx = pageList.indexOf(current);
    let nextIdx = (idx + 1) % pageList.length;
    openPage(pageList[nextIdx]);
}

/* === ฟังก์ชันเครื่องคิดเลขของคุณ (คงเดิมทั้งหมด 100%) === */
let savedScores=[];
let currentDecimal=3;

function scoreToGPA(score){
    let gpa=((score-50)/150)*4;
    if(gpa<0) gpa=0;
    if(gpa>4) gpa=4;
    return gpa;
}

function calculateGPA(){
    const math=parseFloat(document.getElementById("math").value);
    const rla=parseFloat(document.getElementById("rla").value);
    const soc=parseFloat(document.getElementById("soc").value);
    const sci=parseFloat(document.getElementById("sci").value);

    if(isNaN(math)||isNaN(rla)||isNaN(soc)||isNaN(sci)||
    math<0||math>200||rla<0||rla>200||soc<0||soc>200||sci<0||sci>200){
        document.getElementById("res").innerHTML="<div style='text-align:center; margin-top:15px;'><b style='color:#ff7ab6'>Please enter valid scores for all four subjects</b></div>";
        return;
    }
    savedScores=[math,rla,soc,sci];
    renderTable();
}

function toggleDecimal(){
    currentDecimal=currentDecimal===3?2:3;
    renderTable();
}

function renderTable(){
    const names=["Math","RLA","Social","Science"];
    let totalScore=0;
    let totalGPA=0;
    let html="<table><tr><th>Subject</th><th>Score</th><th>GPA</th></tr>";
    for(let i=0;i<4;i++){
        let score=savedScores[i];
        let gpa=scoreToGPA(score);
        totalScore+=score;
        totalGPA+=gpa;
        html+=`<tr><td>${names[i]}</td><td>${score}</td><td>${gpa.toFixed(currentDecimal)}</td></tr>`;
    }
    let gpax=totalGPA/4;
    html+=`<tr class="total-row"><td>TOTAL</td><td>${totalScore}</td><td>GPAX ${gpax.toFixed(currentDecimal)}</td></tr></table>`;
    html+=`<button class="calcbtn" onclick="toggleDecimal()">${currentDecimal===3?"Convert to 2 Decimal Places":"Convert to 3 Decimal Places"}</button>`;
    document.getElementById("res").innerHTML=html;
}
</script>

</body>
</html>
